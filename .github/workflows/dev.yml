name: Deploy development

on:
  push:
    branches:
      - development
    paths:
      - "api/**"
      - "web/**"
      - "packages/**"
      - "scripts/create-admin-user.sh"
      - "scripts/deploy/api.sh"
      - "scripts/deploy/invalidate_web.sh"
      - "scripts/deploy/web.sh"
      - "scripts/migrate.sh"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dev.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: deploy-development
  cancel-in-progress: false

env:
  AWS_REGION: "eu-west-1"
  AWS_USE_PROFILE: "0"
  AWS_WORKLOAD_PROFILE: "dev-prepvilla"
  WORKSPACE: "dev"
  IMAGE_TAG: ${{ github.sha }}
  LINUX_PLATFORM: "arm64"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24.0"
  DJANGO_SETTINGS_MODULE: "config.settings.test"
  DJANGO_DEBUG: "1"
  DJANGO_ENV: "test"
  DJANGO_SECRET_KEY: "ci-secret-key"
  FRONTEND_DOMAIN: "dev.prepvilla.info"
  API_DOMAIN: "api.dev.prepvilla.info"
  FRONTEND_BUCKET: "prepvilla-dev-frontend"
  NEXT_PUBLIC_API_BASE_URL: "https://api.dev.prepvilla.info"
  NEXT_PUBLIC_WS_BASE_URL: "wss://api.dev.prepvilla.info"

jobs:
  detect-web-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            web:
              - "web/**"
              - "packages/**"
              - "scripts/deploy/invalidate_web.sh"
              - "scripts/deploy/web.sh"
              - "package.json"
              - "package-lock.json"
              - ".github/workflows/dev.yml"


  check-web:
    needs: detect-web-changes
    if: needs.detect-web-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm --prefix web run typecheck


  test-web:
    needs:
      - detect-web-changes
      - check-web
    if: needs.detect-web-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm --prefix web run test --if-present


  build-web:
    needs:
      - detect-web-changes
      - test-web
    if: needs.detect-web-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm --prefix web run build:static

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/out
          if-no-files-found: error
          retention-days: 1


  deploy-web:
    needs:
      - detect-web-changes
      - build-web
    if: needs.detect-web-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web/out

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Web
        run: |
          aws s3 sync web/out/ "s3://${FRONTEND_BUCKET}/" \
            --region "${AWS_REGION}" \
            --delete \
            --exclude "*.html" \
            --exclude "_next/static/*"
          aws s3 sync web/out/ "s3://${FRONTEND_BUCKET}/" \
            --region "${AWS_REGION}" \
            --delete \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public,max-age=0,s-maxage=60,must-revalidate"
          if [ -d web/out/_next/static ]; then
            aws s3 sync web/out/_next/static/ "s3://${FRONTEND_BUCKET}/_next/static/" \
              --region "${AWS_REGION}" \
              --delete \
              --cache-control "public,max-age=31536000,immutable"
          fi
          distribution_id="$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items!=null && contains(Aliases.Items, '${FRONTEND_DOMAIN}')].Id | [0]" \
            --output text)"
          test -n "${distribution_id}"
          test "${distribution_id}" != "None"
          aws cloudfront create-invalidation \
            --distribution-id "${distribution_id}" \
            --paths "/*"


  detect-api-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            api:
              - "api/**"
              - "scripts/create-admin-user.sh"
              - "scripts/deploy/api.sh"
              - "scripts/migrate.sh"
              - ".github/workflows/dev.yml"


  check-api:
    needs: detect-api-changes
    if: needs.detect-api-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt

      - name: Check backend
        run: |
          source .venv/bin/activate
          cd api
          python manage.py makemigrations --check --dry-run
          python manage.py check


  test-api:
    needs:
      - detect-api-changes
      - check-api
    if: needs.detect-api-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt

      - name: Run backend tests
        run: |
          source .venv/bin/activate
          cd api
          python manage.py test


  deploy-api:
    needs:
      - detect-api-changes
      - test-api
    if: needs.detect-api-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ env.LINUX_PLATFORM }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy API
        run: SEED_DEMO_ACCOUNTS=1 MIGRATION_START_DB_INSTANCE=1 bash scripts/deploy/api.sh "${WORKSPACE}"


  django-superuser:
    needs:
      - detect-api-changes
      - deploy-api
    if: needs.detect-api-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ env.LINUX_PLATFORM }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create Django Superuser
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DJANGO_SUPERUSER_PASSWORD: ${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
        run: bash scripts/create-admin-user.sh "${WORKSPACE}"
