name: Validate and deploy development

on:
  push:
    branches:
      - development
    paths:
      - "api/**"
      - "web/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepvilla-app-development
  cancel-in-progress: false

env:
  AWS_REGION: "eu-west-1"
  AWS_WORKLOAD_PROFILE: "dev-prepvilla"
  WORKSPACE: "dev"
  IMAGE_TAG: ${{ github.sha }}
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  DJANGO_SETTINGS_MODULE: "config.settings.test"
  DJANGO_ENV: "test"
  DJANGO_DEBUG: "1"
  DJANGO_SECRET_KEY: "ci-secret-key"
  FRONTEND_DOMAIN: "dev.prepvilla.info"
  API_DOMAIN: "api.dev.prepvilla.info"
  FRONTEND_BUCKET: "prepvilla-dev-frontend"
  NEXT_PUBLIC_API_BASE_URL: "https://api.dev.prepvilla.info"
  NEXT_PUBLIC_WS_BASE_URL: "wss://api.dev.prepvilla.info"

jobs:
  changes:
    name: Detect changed applications
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
      api: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.api == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            web:
              - "web/**"
              - "packages/**"
              - "package.json"
              - "package-lock.json"
              - ".github/workflows/dev.yml"
            api:
              - "api/**"
              - "scripts/deploy/api.sh"
              - "scripts/migrate.sh"
              - ".github/workflows/dev.yml"

  web:
    name: Validate and build web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint web
        run: npm run lint --workspace web

      - name: Typecheck web
        run: npm run typecheck --workspace web

      - name: Test web
        run: npm run test --if-present --workspace web

      - name: Build static web application
        run: npm run build:static --workspace web

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-build-${{ github.sha }}
          path: web/out
          if-no-files-found: error
          retention-days: 1

  api:
    name: Validate and test API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r api/requirements.txt

      - name: Check Django configuration and migrations
        working-directory: api
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py check

      - name: Run backend tests
        working-directory: api
        run: python manage.py test

  deploy-web:
    name: Deploy web to development
    needs:
      - changes
      - web
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download web build
        uses: actions/download-artifact@v8
        with:
          name: web-build-${{ github.sha }}
          path: web/out

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: prepvilla-app-dev-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish web assets
        run: |
          aws s3 sync web/out/ "s3://${FRONTEND_BUCKET}/" \
            --region "${AWS_REGION}" \
            --delete \
            --exclude "*.html" \
            --exclude "_next/static/*"
          aws s3 sync web/out/ "s3://${FRONTEND_BUCKET}/" \
            --region "${AWS_REGION}" \
            --delete \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public,max-age=0,s-maxage=60,must-revalidate"
          if [ -d web/out/_next/static ]; then
            aws s3 sync web/out/_next/static/ "s3://${FRONTEND_BUCKET}/_next/static/" \
              --region "${AWS_REGION}" \
              --delete \
              --cache-control "public,max-age=31536000,immutable"
          fi

      - name: Invalidate CloudFront cache
        run: |
          distribution_id="$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items!=null && contains(Aliases.Items, '${FRONTEND_DOMAIN}')].Id | [0]" \
            --output text)"
          test -n "${distribution_id}"
          test "${distribution_id}" != "None"
          aws cloudfront create-invalidation \
            --distribution-id "${distribution_id}" \
            --paths "/*"

  deploy-api:
    name: Deploy API to development
    needs:
      - changes
      - api
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: development
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: prepvilla-api-dev-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          aws-profile: ${{ env.AWS_WORKLOAD_PROFILE }}

      - name: Build and deploy API
        env:
          BACKEND_DIR: api
          REGION: ${{ env.AWS_REGION }}
          SEED_DEMO_ACCOUNTS: "1"
        run: bash scripts/deploy/api.sh "${WORKSPACE}"
